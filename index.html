<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Assignment 4</title>
</head>
<body>

    <h1>Task 0: Simple Contact Form</h1>

    <form action="#" method="post">

        <div>
            <label for="name0">Name:</label>
            <input type="text" id="name0" name="name0">
        </div>

        <div>
            <label for="email0">Email:</label>
            <input type="email" id="email0" name="email0">
        </div>

        <div>
            <label for="message0">Message:</label>
            <textarea id="message0" name="message0" rows="5" cols="30"></textarea>
        </div>

        <div>
            <button type="submit">Submit</button>
        </div>

    </form>


    <h1>Task 1: Form with HTML5 Validation</h1>

    <form action="#" method="post">

        <div>
            <label for="name1">Name:</label>
            <input type="text" id="name1" name="name1"
                   required
                   minlength="2"
                   maxlength="50"
                   placeholder="Enter your name">
        </div>

        <div>
            <label for="email1">Email:</label>
            <input type="email" id="email1" name="email1"
                   required
                   placeholder="example@mail.com">
        </div>

        <div>
            <label for="message1">Message:</label>
            <textarea id="message1" name="message1"
                      rows="5" cols="30"
                      required
                      minlength="10"
                      maxlength="300"
                      placeholder="Write your message (10-300 characters)"></textarea>
        </div>

        <div>
            <button type="submit">Submit</button>
        </div>

    </form>

</body>
</html>
